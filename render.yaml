services:
  - type: web
    name: unsecuredapikeys-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: POSTGRES_CONNECTION_STRING
        sync: false
      - key: PORT
        value: 10000

# Databases section removed as we are using Supabase (External PostgreSQL)
