services:
  - type: web
    name: unsecuredapikeys-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_PATH
        value: /app/data/unsecuredapikeys.db
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: POSTGRES_CONNECTION_STRING
        fromDatabase:
          name: apikeys-db
          property: connectionString
      - key: PORT
        generateValue: true

databases:
  - name: apikeys-db
    plan: free
    region: oregon
