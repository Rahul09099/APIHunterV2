services:
  - type: web
    name: unsecuredapikeys-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: USER_ACCESS_CODE
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: ACCESS_SESSION_HOURS
        value: 12
      - key: POSTGRES_CONNECTION_STRING
        sync: false
      - key: PORT
        value: 10000
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_GCConserveMemory
        value: "5"
      - key: DOTNET_GCHeapHardLimitPercent
        value: "75"

# Databases section removed as we are using Supabase (External PostgreSQL)
